<!doctype html>
<!--
  ATLAS DASHBOARD TEMPLATE
  ========================
  1. Copy this file to /dashboards/<your-name>.html (keeps the relative paths below working).
  2. Point the data <script> at your data file (see docs/data.md), or remove it and use the Upload button.
  3. Edit the JSON config block: title, logo, nav, filters, visuals.
  4. Open the file in a browser. No build step, no server.

  Every visual and filter is documented in docs/config-reference.md and shown live in gallery/index.html.
  AI assistants: read AGENTS.md first; only edit the JSON block and the data <script> unless asked otherwise.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Desk</title>

  <!-- Framework (do not edit) -->
  <link rel="stylesheet" href="../atlas/atlas.css">
  <script src="../vendor/echarts/echarts.min.js"></script>
  <script src="../atlas/atlas.js"></script>
  <script src="../atlas/visuals.js"></script>

  <!-- Optional brand theme: uncomment one, or write your own (docs/theming.md) -->
  <!-- <link rel="stylesheet" href="../themes/midnight.css"> -->
  <!-- <link rel="stylesheet" href="../themes/evergreen.css"> -->

  <!-- DATA: one or more files that call Atlas.registerData("name", rows) -->
  <script src="starter-data.js"></script>
</head>
<body>
<!-- CONFIG: everything on the page is generated from this block. It must be valid JSON. -->
<script type="application/json" data-atlas>
{
  "title": "Service Desk",
  "subtitle": "Ticket volume, resolution time and satisfaction",
  "logo": "../assets/logo.svg",
  "nav": [
    { "label": "Overview", "href": "dashboard.html" },
    { "label": "Gallery", "href": "../gallery/index.html" }
  ],
  "toolbar": { "upload": true, "download": true, "print": true, "theme": true },
  "data": "starter",
  "fields": {
    "tickets": { "format": "integer" },
    "hoursToResolve": { "label": "Hours to resolve", "format": "decimal" },
    "satisfaction": { "label": "CSAT", "format": "decimal" }
  },
  "filters": [
    { "type": "dateRange", "field": "date", "label": "Period" },
    { "type": "buttons", "field": "team" },
    { "type": "dropdown", "field": "channel" }
  ],
  "visuals": [
    { "type": "card", "title": "Tickets", "value": "tickets", "span": 3 },
    { "type": "kpi", "title": "Avg. hours to resolve", "value": { "field": "hoursToResolve", "agg": "avg" }, "target": 5, "higherIsBetter": false, "trend": "date", "span": 3 },
    { "type": "gauge", "title": "Customer satisfaction", "value": { "field": "satisfaction", "agg": "avg" }, "min": 0, "max": 5, "target": 4.5, "span": 3 },
    { "type": "card", "title": "Escalated", "value": "tickets", "filter": { "status": "Escalated" }, "span": 3 },
    { "type": "stackedColumn", "title": "Tickets by month and status", "category": "date", "grain": "month", "series": "status", "value": "tickets", "span": 8 },
    { "type": "donut", "title": "Tickets by channel", "category": "channel", "value": "tickets", "span": 4 },
    { "type": "matrix", "title": "Tickets by team and status", "rows": ["team"], "columns": "status", "value": "tickets", "span": 12 }
  ]
}
</script>
</body>
</html>
